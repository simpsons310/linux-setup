"$schema" = 'https://starship.rs/config-schema.json'

# Blank line between prompts
add_newline = true

# Dracula palette (defined at the bottom of this file)
palette = "dracula"

# ---------------------------------------------------------------------------
# Core prompt pieces
# ---------------------------------------------------------------------------

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[username]
format = "[$user]($style) on "
style_user = "bold cyan"
style_root = "bold red"

[hostname]
ssh_symbol = " "
style = "bold purple"

[directory]
style = "bold green"
read_only = " 󰌾"
read_only_style = "bold red"
truncation_length = 3

[cmd_duration]
min_time = 0
show_milliseconds = true
style = "bold yellow"
format = "took [$duration]($style) "

[status]
symbol = " "
style = "bold red"
disabled = false

[sudo]
symbol = " "
style = "bold purple"

[shlvl]
symbol = "󰹍 "
style = "bold comment"

[memory_usage]
symbol = "󰍛 "
style = "bold comment"

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

# ---------------------------------------------------------------------------
# Version control
# ---------------------------------------------------------------------------

[git_branch]
symbol = " "
style = "bold pink"

[git_status]
style = "bold red"

[git_commit]
tag_symbol = "  "
style = "bold pink"

[git_state]
style = "bold orange"

[fossil_branch]
symbol = " "
style = "bold pink"

[hg_branch]
symbol = " "
style = "bold pink"

[pijul_channel]
